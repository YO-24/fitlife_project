<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>FitLife | Tu Espacio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Montserrat', sans-serif; }</style>
</head>
<body class="bg-black text-white antialiased">
    <!-- Navbar -->
    <nav class="bg-black text-white p-4 sticky top-0 z-50 border-b border-zinc-800 shadow-xl">
        <div class="max-w-7xl mx-auto flex justify-between items-center px-4">
            <a href="/" class="flex items-center gap-2">
                <div class="w-8 h-8 bg-yellow-400 rounded-sm transform rotate-45"></div>
                <h1 class="text-3xl font-black tracking-tighter italic">FIT<span class="text-yellow-400">LIFE</span></h1>
            </a>
            <div class="hidden md:flex gap-6 font-bold text-sm uppercase tracking-wider">
                <a href="/gimnasios/" class="hover:text-yellow-400 transition">Gimnasios</a>
                <a href="/tuespacio/" class="text-yellow-400">Tu espacio</a>
                <a href="/app/" class="hover:text-yellow-400 transition">App</a>
                <a href="/#planes" class="hover:text-yellow-400 transition">Planes</a>
            </div>
            <div class="flex gap-4">
                <a href="/login/" class="border-2 border-zinc-600 hover:border-white px-5 py-2 rounded-full font-bold text-sm transition">Iniciar Sesión</a>
                <a href="/registro/" class="bg-yellow-400 text-black hover:bg-yellow-500 px-5 py-2 rounded-full font-bold text-sm transition">Registrarte</a>
            </div>
        </div>
    </nav>

    <!-- Contenido Tu Espacio -->
    <section class="py-20">
        <div class="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-2 gap-16 items-center">
            <div>
                <h3 class="text-5xl font-black uppercase mb-6 tracking-tight">Tu <span class="text-yellow-400">Espacio</span></h3>
                <p class="text-zinc-400 text-lg mb-6 font-medium">Centro de autogestión administrativa. Utiliza este canal para:</p>
                <ul class="space-y-4 font-bold text-sm uppercase tracking-wider text-zinc-300">
                    <li class="flex items-center gap-3"><span class="text-yellow-400 text-xl">✓</span> Solicitud de cambio de planes</li>
                    <li class="flex items-center gap-3"><span class="text-yellow-400 text-xl">✓</span> Congelamiento de suscripciones</li>
                    <li class="flex items-center gap-3"><span class="text-yellow-400 text-xl">✓</span> Soporte técnico de cobros</li>
                </ul>
            </div>
            <div class="bg-zinc-900 p-8 md:p-10 rounded-3xl border border-zinc-800 shadow-2xl">
                <form onsubmit="event.preventDefault(); alert('Solicitud enviada. Te contactaremos a la brevedad.');">
                    <div class="mb-6">
                        <label class="block text-sm font-bold text-zinc-500 mb-2 uppercase tracking-wider">Correo Registrado</label>
                        <input type="email" required class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-4 focus:outline-none focus:border-yellow-400 text-white transition" placeholder="ejemplo@correo.com">
                    </div>
                    <div class="mb-8">
                        <label class="block text-sm font-bold text-zinc-500 mb-2 uppercase tracking-wider">Mensaje</label>
                        <textarea rows="4" required class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-4 focus:outline-none focus:border-yellow-400 text-white transition" placeholder="Explícanos tu caso..."></textarea>
                    </div>
                    <button type="submit" class="w-full bg-yellow-400 text-black font-black uppercase tracking-widest py-5 rounded-xl hover:bg-yellow-500 transition-transform hover:scale-105">
                        Enviar Solicitud
                    </button>
                </form>
            </div>
        </div>
    </section>
</body>
</html>
