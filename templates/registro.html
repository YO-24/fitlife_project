<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>FitLife | Crear Cuenta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Montserrat', sans-serif; }</style>
</head>
<body class="bg-black text-white h-screen flex items-center justify-center relative overflow-hidden">
    <div class="absolute inset-0 bg-[radial-gradient(#27272a_1px,transparent_1px)] [background-size:20px_20px] opacity-30"></div>
    
    <div class="bg-zinc-900 p-10 rounded-3xl shadow-2xl border border-zinc-800 w-full max-w-md z-10 relative">
        <div class="text-center mb-10">
            <div class="flex justify-center items-center gap-2 mb-4">
                <div class="w-6 h-6 bg-yellow-400 rounded-sm transform rotate-45"></div>
                <h1 class="text-3xl font-black tracking-tighter italic">FIT<span class="text-yellow-400">LIFE</span></h1>
            </div>
            <h2 class="text-2xl font-bold">Crea tu cuenta</h2>
            <p class="text-zinc-400 mt-2 text-sm">Únete a la mejor comunidad fitness</p>
        </div>

        <form method="POST" action="">
            {% csrf_token %}
            <div class="mb-6">
                <label class="block text-sm font-bold text-zinc-400 mb-2 uppercase tracking-wider">Nuevo Usuario</label>
                <input type="text" name="username" class="w-full bg-black border border-zinc-700 text-white rounded-lg px-4 py-3 focus:outline-none focus:border-yellow-400 transition" required>
            </div>
            <div class="mb-8">
                <label class="block text-sm font-bold text-zinc-400 mb-2 uppercase tracking-wider">Contraseña</label>
                <input type="password" name="password" class="w-full bg-black border border-zinc-700 text-white rounded-lg px-4 py-3 focus:outline-none focus:border-yellow-400 transition" required>
            </div>
            
            {% if error %}
            <p class="text-red-500 text-sm font-bold mb-4 text-center">{{ error }}</p>
            {% endif %}

            <button type="submit" class="w-full bg-yellow-400 text-black font-black uppercase tracking-widest py-4 rounded-full hover:bg-yellow-500 transition-transform hover:scale-105 shadow-[0_0_15px_rgba(250,204,21,0.3)]">
                Registrarme
            </button>
        </form>
        <p class="text-center mt-6 text-zinc-500 text-sm">¿Ya tienes cuenta? <a href="/login/" class="text-yellow-400 hover:underline">Inicia Sesión</a></p>
    </div>
</body>
</html>
