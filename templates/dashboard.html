<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitLife | Mi Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Montserrat', sans-serif; }</style>
</head>
<body class="bg-zinc-100 text-zinc-900 antialiased">

    <!-- Navegación del Dashboard -->
    <nav class="bg-black text-white p-4 sticky top-0 z-50 border-b border-zinc-800 shadow-xl">
        <div class="max-w-7xl mx-auto flex justify-between items-center px-4">
            <a href="/" class="flex items-center gap-2">
                <div class="w-8 h-8 bg-yellow-400 rounded-sm transform rotate-45"></div>
                <h1 class="text-3xl font-black tracking-tighter italic">FIT<span class="text-yellow-400">LIFE</span></h1>
            </a>
            
            <div class="flex items-center gap-4">
                <span class="font-bold text-sm text-zinc-400 hidden md:block">Hola, {{ user.username|default:"Atleta"|upper }}</span>
                
                {% if user.is_superuser or user.is_staff %}
                <a href="/admin/" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-full font-bold text-xs uppercase tracking-wider transition shadow-lg">
                    ⚙️ Panel Admin
                </a>
                {% endif %}
                
                <a href="/" class="border-2 border-zinc-600 hover:border-white px-4 py-2 rounded-full font-bold text-xs uppercase tracking-wider transition">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-10 px-4 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Columna Izquierda: Membresía y Acceso QR -->
        <div class="lg:col-span-1 space-y-8">
            <div class="bg-black text-white rounded-3xl p-8 shadow-2xl border border-zinc-800 relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 bg-yellow-400 opacity-10 rounded-bl-full"></div>
                <h2 class="text-2xl font-black uppercase tracking-widest mb-2">Mi Membresía</h2>
                
                <div class="my-6">
                    <p class="text-sm text-zinc-400 font-bold uppercase tracking-wider mb-1">Estado Actual</p>
                    <div class="inline-block bg-green-500 text-black px-4 py-1 rounded-full font-black text-sm uppercase tracking-widest">
                        Activa
                    </div>
                </div>

                <div class="border-t border-zinc-800 pt-6">
                    <p class="text-sm text-zinc-400 font-bold uppercase tracking-wider mb-4">Código de Acceso (Torniquete)</p>
                    <div class="bg-white p-4 rounded-xl inline-block shadow-inner">
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=FITLIFE-ACCESO-{{ user.username|default:'TEST' }}" alt="QR Torniquete" class="w-32 h-32">
                    </div>
                    <p class="text-xs text-zinc-500 mt-3 font-medium">Acerca este código al escáner de tu sede.</p>
                </div>
            </div>
        </div>

        <!-- Columna Derecha: Reserva de Clases -->
        <div class="lg:col-span-2 space-y-8">
            <div class="bg-white rounded-3xl p-8 shadow-xl border border-zinc-200">
                <div class="flex justify-between items-center mb-8 border-b border-zinc-200 pb-4">
                    <h2 class="text-3xl font-black uppercase tracking-tight">Clases <span class="text-yellow-500">Disponibles</span></h2>
                    <span class="text-sm font-bold text-zinc-500">Hoy</span>
                </div>

                <!-- Contenedor de JavaScript -->
                <div id="contenedor-clases" class="space-y-4">
                    <!-- Si ves esto en pantalla más de 1 segundo, hay un error en JS -->
                    <div class="flex justify-center py-8">
                        <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-yellow-400"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Script Robusto -->
    <script>
        // 1. Datos iniciales para que NUNCA quede cargando
        let misClases = [
            { id: 1, nombre: "Yoga Vinyasa", hora: "18:00", sala: "Sala 2", aforo: 12, capacidad: 20, profe: "Prof. María José" },
            { id: 2, nombre: "Spinning Pro", hora: "19:30", sala: "Sala Cardio", aforo: 20, capacidad: 20, profe: "Prof. Carlos" },
            { id: 3, nombre: "CrossFit WOD", hora: "20:00", sala: "Zona Libre", aforo: 18, capacidad: 20, profe: "Prof. Andrés" }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            // Dibujar las clases de demostración inmediatamente
            dibujarClases(misClases);
            
            // Buscar datos reales en el backend sin bloquear la pantalla
            fetch('/api/clases/')
                .then(res => res.json())
                .then(data => {
                    if (data && data.length > 0) {
                        misClases = data; // Reemplazar por los de la Base de Datos
                        dibujarClases(misClases);
                    }
                })
                .catch(error => {
                    console.log("No hay conexión con la API, operando con datos locales.");
                });
        });

        // 2. Función principal que dibuja el HTML
        function dibujarClases(lista) {
            const contenedor = document.getElementById('contenedor-clases');
            if (!contenedor) return;
            
            let htmlAcumulado = '';
            
            lista.forEach(clase => {
                const id = clase.id;
                const nombre = clase.nombre || clase.nombre_clase || "Clase FitLife";
                let horaStr = clase.hora || clase.hora_inicio || "00:00";
                if (horaStr.length > 5) horaStr = horaStr.substring(0, 5);
                
                const sala = clase.sala || "Sala Principal";
                const profe = clase.profe || "Staff";
                const aforo = (clase.aforo_actual !== undefined) ? clase.aforo_actual : clase.aforo;
                const capacidad = clase.capacidad || clase.capacidad_maxima || 20;
                
                const estaLlena = aforo >= capacidad;
                const colorAforo = estaLlena ? 'text-red-500' : (aforo > capacidad * 0.8 ? 'text-yellow-600' : 'text-green-600');
                
                const btnHtml = estaLlena 
                    ? `<button onclick="alertaListaEspera('${nombre}')" class="bg-zinc-800 text-white px-6 py-3 rounded-full font-black text-sm uppercase tracking-widest hover:bg-zinc-900 transition w-full md:w-auto mt-4 md:mt-0">Lista de Espera</button>`
                    : `<button onclick="reservarClase(${id})" class="bg-yellow-400 text-black px-6 py-3 rounded-full font-black text-sm uppercase tracking-widest hover:scale-105 transition shadow-lg shadow-yellow-400/20 w-full md:w-auto mt-4 md:mt-0">Reservar</button>`;

                htmlAcumulado += `
                    <div class="flex flex-col md:flex-row justify-between items-center p-6 bg-zinc-50 rounded-2xl border border-zinc-200 hover:border-yellow-400 transition shadow-sm">
                        <div class="flex items-center gap-6 w-full md:w-auto">
                            <div class="bg-black text-yellow-400 w-16 h-16 rounded-xl flex flex-col items-center justify-center font-black shrink-0">
                                <span class="text-lg">${horaStr}</span>
                            </div>
                            <div>
                                <h3 class="text-xl font-black uppercase tracking-wider">${nombre}</h3>
                                <p class="text-sm font-bold text-zinc-500">${sala} • ${profe}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-6 w-full md:w-auto justify-between md:justify-end mt-4 md:mt-0 border-t md:border-t-0 border-zinc-200 pt-4 md:pt-0">
                            <div class="text-center md:text-right">
                                <p class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Aforo</p>
                                <p class="font-black text-xl ${colorAforo}">${aforo}/${capacidad}</p>
                            </div>
                            ${btnHtml}
                        </div>
                    </div>
                `;
            });
            
            // Inyectamos todo de golpe (borrando el spinner automáticamente)
            contenedor.innerHTML = htmlAcumulado;
        }

        // 3. Reactividad interactiva al hacer clic
        window.reservarClase = function(idClase) {
            const claseIndex = misClases.findIndex(c => c.id === idClase);
            if (claseIndex !== -1) {
                const clase = misClases[claseIndex];
                const nombre = clase.nombre || clase.nombre_clase;
                const aforoActual = clase.aforo_actual !== undefined ? clase.aforo_actual : clase.aforo;
                const capacidad = clase.capacidad || clase.capacidad_maxima || 20;

                if (aforoActual < capacidad) {
                    if (clase.aforo !== undefined) clase.aforo++;
                    if (clase.aforo_actual !== undefined) clase.aforo_actual++;
                    
                    alert(`✅ ¡Reserva confirmada para ${nombre}!\nSe ha descontado un cupo del aforo.`);
                    dibujarClases(misClases); // Re-dibuja los números actualizados
                }
            }
        };

        window.alertaListaEspera = function(nombre) {
            alert(`⚠️ La clase de ${nombre} está llena.\nHas sido ingresado a la lista de espera automáticamente.`);
        };
    </script>
</body>
</html>
